# Reward function configuration
# Hyperparameters and weights for reward calculation

# Reward component weights
weights:
  base_reward: 1.0
  quality_reward: 0.8
  coherence_reward: 0.6
  completeness_reward: 0.7

# Penalty multipliers
penalties:
  length_penalty: 0.1
  repetition_penalty: 0.2
  toxicity_penalty: 1.0
  
# Scoring thresholds
thresholds:
  min_length: 10
  max_length: 2000
  quality_threshold: 5.0
  
# Reward scaling
scaling:
  reward_scale: 1.0
  reward_clip_min: -10.0
  reward_clip_max: 10.0

# Judge call parameters
judge:
  temperature: 0.0
  max_tokens: 10
  timeout: 30.0
